<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REVdePois 2026 — Réseau d'essai</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, sans-serif; background: #f5f3ee; color: #2c2c2a; height: 100vh; display: flex; flex-direction: column; }

header {
  background: #fff; border-bottom: 1px solid #e0ded6;
  padding: 12px 20px; display: flex; align-items: center; gap: 12px; flex-shrink: 0;
}
.logo { background: #2E7D32; color: #fff; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 5px; }
header h1 { font-size: 15px; font-weight: 500; }
header span { font-size: 12px; color: #888; margin-left: auto; }

.layout { display: flex; flex: 1; overflow: hidden; }
#map { flex: 1; }

.panel {
  width: 320px; background: #fff;
  border-left: 1px solid #e0ded6;
  display: flex; flex-direction: column; overflow: hidden;
}

.panel-header {
  padding: 14px 16px 10px;
  border-bottom: 1px solid #f0ede6;
  background: #fafaf8; flex-shrink: 0;
}
.panel-header h2 { font-size: 13px; font-weight: 500; color: #444; }
.panel-header p { font-size: 11px; color: #888; margin-top: 2px; }

#site-list { flex: 1; overflow-y: auto; }
#site-detail { display: none; flex-direction: column; flex: 1; overflow-y: auto; }
#site-detail.visible { display: flex; }

.back-btn {
  padding: 10px 16px; font-size: 12px; color: #2E7D32;
  cursor: pointer; border: none; background: none;
  border-bottom: 1px solid #f0ede6; text-align: left;
  width: 100%; flex-shrink: 0;
}
.back-btn:hover { background: #f5f3ee; }

.detail-body { padding: 16px; flex: 1; overflow-y: auto; }
.detail-body h2 { font-size: 15px; font-weight: 500; margin-bottom: 3px; }
.detail-body .loc { font-size: 11px; color: #888; margin-bottom: 12px; }

.pill {
  display: inline-block; font-size: 10px; font-weight: 600;
  padding: 2px 8px; border-radius: 20px; margin-bottom: 12px;
}
.pill-station { background: #E0E7FF; color: #3730A3; }
.pill-ferme { background: #DCFCE7; color: #14532D; }
.pill-perdu { background: #FEE2E2; color: #991B1B; }
.pill-partiel { background: #FEF9EC; color: #7C4F00; }

.section-label {
  font-size: 10px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.06em; color: #888; margin: 12px 0 5px;
}

.info-row { display: flex; gap: 8px; margin-bottom: 5px; font-size: 12px; }
.info-row .lbl { color: #888; flex-shrink: 0; width: 100px; }
.info-row .val { color: #2c2c2a; }

.var-list { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
.var-tag {
  font-size: 10px; padding: 2px 7px;
  border-radius: 20px; border: 1px solid #e0ded6; color: #444;
}

.result-table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 6px; }
.result-table th { background: #2E7D32; color: #fff; padding: 5px 6px; text-align: left; }
.result-table td { padding: 4px 6px; border-bottom: 1px solid #f0ede6; }
.result-table tr:nth-child(even) td { background: #f8f7f4; }

.verbatim {
  background: #f8f7f4; border-left: 3px solid #2E7D32;
  padding: 8px 10px; font-size: 11px; font-style: italic;
  color: #555; border-radius: 0 4px 4px 0; margin-top: 8px;
}
.verbatim cite { display: block; margin-top: 4px; font-style: normal; font-size: 10px; color: #888; }

.note-box {
  background: #FEF9EC; border: 1px solid #FCD34D;
  border-radius: 6px; padding: 8px 10px;
  font-size: 11px; color: #7C4F00; margin-top: 8px;
}

/* Cards liste */
.site-group-label {
  padding: 8px 16px 3px; font-size: 10px; font-weight: 600;
  color: #888; text-transform: uppercase; letter-spacing: 0.06em;
  background: #fafaf8; border-bottom: 1px solid #f0ede6;
}
.site-card {
  padding: 11px 16px; border-bottom: 1px solid #f0ede6;
  cursor: pointer; display: flex; align-items: center; gap: 10px;
}
.site-card:hover { background: #f5f3ee; }
.site-card.active { background: #DCFCE7; }
.site-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.site-card h3 { font-size: 12px; font-weight: 500; margin-bottom: 1px; }
.site-card p { font-size: 11px; color: #888; }

.legend {
  padding: 10px 16px; border-top: 1px solid #e0ded6;
  background: #fafaf8; flex-shrink: 0;
}
.legend p { font-size: 10px; font-weight: 600; color: #444; margin-bottom: 5px; }
.leg-row { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #555; margin-bottom: 3px; }
.leg-dot { width: 10px; height: 10px; border-radius: 50%; }
</style>
</head>

// ===== CARTE =====
const map = L.map('map', { center: [48.1, -2.8], zoom: 8 });
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap contributors', maxZoom: 16
}).addTo(map);

function makeIcon(color, type) {
  const s = type === 'station' ? 16 : 12;
  const shape = type === 'station'
    ? `<rect x="2" y="2" width="${s}" height="${s}" rx="3" fill="${color}" stroke="white" stroke-width="2"/>`
    : `<circle cx="${s/2+2}" cy="${s/2+2}" r="${s/2}" fill="${color}" stroke="white" stroke-width="2"/>`;
  return L.divIcon({
    className: '',
    html: `<svg width="${s+4}" height="${s+4}">${shape}</svg>`,
    iconSize: [s+4, s+4],
    iconAnchor: [(s+4)/2, (s+4)/2]
  });
}

const markers = {};
sites.forEach(s => {
  const m = L.marker([s.lat, s.lng], { icon: makeIcon(s.color, s.type) }).addTo(map);
  m.bindTooltip(s.nom + ' — ' + s.dep, { permanent: false });
  m.on('click', () => showDetail(s.id));
  markers[s.id] = m;
});

// ===== LISTE =====
const listEl = document.getElementById('site-list');
const detailEl = document.getElementById('site-detail');
const detailBody = document.getElementById('detail-body');
const backBtn = document.getElementById('back-btn');

function renderList() {
  listEl.innerHTML = '';
  const stations = sites.filter(s => s.type === 'station');
  const fermes = sites.filter(s => s.type === 'ferme');

  listEl.innerHTML += `<div class="site-group-label">Stations expérimentales</div>`;
  stations.forEach(s => {
    listEl.innerHTML += `
      <div class="site-card" id="card-${s.id}" onclick="showDetail('${s.id}')">
        <div class="site-dot" style="background:${s.color}"></div>
        <div><h3>${s.nom}</h3><p>${s.dep}</p></div>
      </div>`;
  });

  listEl.innerHTML += `<div class="site-group-label">Fermes agriculteurs</div>`;
  fermes.forEach(s => {
    listEl.innerHTML += `
      <div class="site-card" id="card-${s.id}" onclick="showDetail('${s.id}')">
        <div class="site-dot" style="background:${s.color}"></div>
        <div><h3>${s.nom}</h3><p>${s.dep}</p></div>
      </div>`;
  });
}

function showDetail(id) {
  const s = sites.find(x => x.id === id);
  if (!s) return;
  document.querySelectorAll('.site-card').forEach(c => c.classList.remove('active'));
  const card = document.getElementById('card-' + id);
  if (card) card.classList.add('active');
  map.flyTo([s.lat, s.lng], 11, { duration: 0.8 });
  detailBody.innerHTML = `<h2>${s.nom}</h2><div class="loc">${s.dep}</div>${s.html}`;
  listEl.style.display = 'none';
  detailEl.classList.add('visible');
}

backBtn.addEventListener('click', () => {
  listEl.style.display = 'block';
  detailEl.classList.remove('visible');
  document.querySelectorAll('.site-card').forEach(c => c.classList.remove('active'));
  map.flyTo([48.1, -2.8], 8, { duration: 0.8 });
});

renderList();
</script>
